apiVersion: apps/v1
kind: Deployment
metadata:
  name: wargacare-backend
  namespace: wargacare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wargacare-backend
  template:
    metadata:
      labels:
        app: wargacare-backend
    spec:
      containers:
      - name: wargacare-backend
        image: wargacare-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: wargacare-config
        - secretRef:
            name: wargacare-secret
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: wargacare-service
  namespace: wargacare
spec:
  selector:
    app: wargacare-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
